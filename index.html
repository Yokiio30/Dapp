<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>My Dapp</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; padding-bottom:env(safe-area-inset-bottom); background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.4; }
  main { max-width:480px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:1.4rem; margin:8px 0 0; }
  .card { background:var(--card); border-radius:14px; padding:16px; }
  .label { color:var(--muted); font-size:.8rem; margin-bottom:4px; }
  .val { font-size:1.05rem; word-break:break-all; }
  button, input, textarea { width:100%; font-size:1rem; padding:14px; border-radius:10px; border:1px solid #334155;
         background:#0b1220; color:var(--text); margin-top:8px; }
  button { background:var(--accent); border:0; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  button.secondary { background:#334155; }
  #status { font-size:.9rem; min-height:1.2em; word-break:break-all; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>My Dapp</h1>

  <div class="card" id="connectCard">
    <button id="connectBtn">Connect Wallet</button>
    <a id="mmLink" style="display:none"><button class="secondary" type="button">Open in MetaMask app</button></a>
    <div class="label" style="margin-top:10px">On a phone, open this page inside the MetaMask (or any wallet) browser.</div>
  </div>

  <div class="card" id="infoCard" style="display:none">
    <div class="label">Account</div><div class="val" id="addr"></div>
    <div class="label" style="margin-top:10px">Network</div><div class="val" id="net"></div>
    <div class="label" style="margin-top:10px">Balance</div><div class="val" id="bal"></div>
  </div>

  <div class="card" id="sendCard" style="display:none">
    <div class="label">Send ETH</div>
    <input id="to" placeholder="Recipient address (0x...)" autocapitalize="off" autocomplete="off">
    <input id="amt" placeholder="Amount" inputmode="decimal">
    <button id="sendBtn">Send</button>
  </div>

  <div class="card" id="signCard" style="display:none">
    <div class="label">Sign a message</div>
    <textarea id="msg" rows="2">Hello from my Dapp</textarea>
    <button id="signBtn" class="secondary">Sign</button>
  </div>

  <div id="status"></div>
</main>

<script type="module">
import { BrowserProvider, formatEther, parseEther, isAddress } from "https://cdn.jsdelivr.net/npm/ethers@6.13.4/+esm";

const $ = id => document.getElementById(id);
const status = (t, cls="") => { $("status").className = cls; $("status").textContent = t; };
let provider, signer;

// Deep link for phones without an injected wallet
if (!window.ethereum) {
  $("mmLink").href = "https://metamask.app.link/dapp/" + location.host + location.pathname;
  $("mmLink").style.display = "block";
}

async function refresh() {
  const addr = await signer.getAddress();
  const [net, bal] = await Promise.all([provider.getNetwork(), provider.getBalance(addr)]);
  $("addr").textContent = addr;
  $("net").textContent = `${net.name} (chain ${net.chainId})`;
  $("bal").textContent = `${Number(formatEther(bal)).toFixed(5)} ETH`;
  ["infoCard","sendCard","signCard"].forEach(i => $(i).style.display = "block");
  $("connectBtn").textContent = "Connected";
  $("connectBtn").disabled = true;
}

$("connectBtn").onclick = async () => {
  if (!window.ethereum) return status("No wallet found. Use the wallet's built-in browser.", "err");
  try {
    provider = new BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    await refresh();
    status("Connected", "ok");
    window.ethereum.on?.("accountsChanged", () => location.reload());
    window.ethereum.on?.("chainChanged", () => location.reload());
  } catch (e) { status(e.shortMessage || e.message, "err"); }
};

$("sendBtn").onclick = async () => {
  try {
    const to = $("to").value.trim(), amt = $("amt").value.trim();
    if (!isAddress(to)) return status("Invalid address", "err");
    if (!amt || Number(amt) <= 0) return status("Invalid amount", "err");
    status("Confirm in your wallet...");
    const tx = await signer.sendTransaction({ to, value: parseEther(amt) });
    status("Sent: " + tx.hash + " (waiting)");
    await tx.wait();
    status("Confirmed: " + tx.hash, "ok");
    refresh();
  } catch (e) { status(e.shortMessage || e.message, "err"); }
};

$("signBtn").onclick = async () => {
  try {
    const sig = await signer.signMessage($("msg").value);
    status("Signature: " + sig, "ok");
  } catch (e) { status(e.shortMessage || e.message, "err"); }
};
</script>
</body>
</html>
