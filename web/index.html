<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>链上小银行</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --line:#243049; --text:#e6ebf5; --muted:#8fa0bd;
    --accent:#5b8cff; --accent2:#3d6be6; --ok:#34d399; --err:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;
    line-height:1.45;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  main{max-width:480px;margin:0 auto;display:grid;gap:14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:1.25rem;margin:0}
  .pill{font-size:.75rem;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#1f5b47}
  .pill.bad{color:var(--warn);border-color:#6b5514}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .hero{background:linear-gradient(135deg,#1c2f5e,#131c2e);}
  .label{font-size:.78rem;color:var(--muted)}
  .big{font-size:2rem;font-weight:700;letter-spacing:-.5px;word-break:break-all}
  .row{display:flex;gap:12px;margin-top:12px}
  .row>div{flex:1;min-width:0}
  .val{font-size:1.05rem;font-weight:600;word-break:break-all}
  button,input{font:inherit;font-size:1rem;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);
    background:#0d1626;color:var(--text);padding:12px 14px}
  input{margin-top:8px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);border:0;font-weight:600;cursor:pointer;margin-top:10px}
  button:active{background:var(--accent2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:#1b2740;color:var(--text)}
  button.small{width:auto;min-height:36px;padding:6px 12px;font-size:.85rem;margin:0}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0d1626;padding:4px;border-radius:12px;border:1px solid var(--line)}
  .tabs button{margin:0;min-height:40px;background:transparent;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
  .panel[hidden]{display:none}
  .inline{display:flex;gap:8px;align-items:stretch}
  .inline input{margin-top:8px}
  .inline button{margin-top:8px;width:auto;white-space:nowrap}
  .banner{border-radius:12px;padding:12px 14px;font-size:.9rem;background:#2b2410;border:1px solid #6b5514;color:#fde68a}
  .banner[hidden]{display:none}
  #status{white-space:pre-wrap;word-break:break-all;font-size:.9rem;min-height:1.3em}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)}
  #status a{color:var(--accent)}
  ul{list-style:none;margin:8px 0 0;padding:0}
  li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
  li:first-child{border-top:0}
  li .sub{color:var(--muted);font-size:.78rem}
  li a{color:inherit;text-decoration:none}
  .pos{color:var(--ok);font-weight:600;white-space:nowrap} .neg{color:var(--err);font-weight:600;white-space:nowrap}
  .empty{color:var(--muted);font-size:.9rem;padding:8px 0}
  footer{font-size:.75rem;color:var(--muted);text-align:center}
  a.link{color:var(--accent)}
</style>
</head>
<body>
<main>
  <header>
    <h1>🏦 链上小银行</h1>
    <span id="netPill" class="pill">未连接</span>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card hero">
    <div class="label">我的银行余额</div>
    <div class="big"><span id="bankBal">—</span> <span id="sym1" style="font-size:1rem;font-weight:500"></span></div>
    <div class="row">
      <div><div class="label">钱包余额</div><div class="val" id="walBal">—</div></div>
      <div><div class="label">银行总存款</div><div class="val" id="totalDep">—</div></div>
    </div>
    <div class="label" style="margin-top:12px">账户</div>
    <div class="val" id="acct" style="font-size:.9rem">未连接</div>
    <button id="connectBtn">连接钱包</button>
    <a id="mmLink" hidden><button class="ghost" type="button">在 MetaMask 中打开</button></a>
  </section>

  <section class="card" id="actions">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="deposit">存款</button>
      <button role="tab" aria-selected="false" data-tab="withdraw">取款</button>
      <button role="tab" aria-selected="false" data-tab="transfer">转账</button>
    </div>

    <div class="panel" id="p-deposit">
      <div class="label" style="margin-top:14px">把钱包里的 ETH 存入银行</div>
      <input id="depAmt" inputmode="decimal" placeholder="存款金额" autocomplete="off">
      <button id="depBtn" data-need-wallet>确认存款</button>
    </div>

    <div class="panel" id="p-withdraw" hidden>
      <div class="label" style="margin-top:14px">从银行取回 ETH 到你的钱包</div>
      <div class="inline">
        <input id="wdAmt" inputmode="decimal" placeholder="取款金额" autocomplete="off">
        <button class="ghost small" id="wdMax" type="button">全部</button>
      </div>
      <button id="wdBtn" data-need-wallet>确认取款</button>
    </div>

    <div class="panel" id="p-transfer" hidden>
      <div class="label" style="margin-top:14px">转给另一个地址的银行账户（对方之后可自行取出）</div>
      <input id="toAddr" placeholder="收款地址 0x..." autocapitalize="off" autocomplete="off" spellcheck="false">
      <div class="inline">
        <input id="trAmt" inputmode="decimal" placeholder="转账金额" autocomplete="off">
        <button class="ghost small" id="trMax" type="button">全部</button>
      </div>
      <button id="trBtn" data-need-wallet>确认转账</button>
    </div>

    <div id="status" role="status" aria-live="polite" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>最近记录</strong>
      <button class="ghost small" id="reloadBtn" type="button">刷新</button>
    </div>
    <ul id="history"><li class="empty">连接钱包后显示</li></ul>
  </section>

  <footer>
    合约未经专业审计，仅建议在测试网使用。<br>
    <a id="contractLink" class="link" target="_blank" rel="noopener noreferrer" hidden>查看合约</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script src="abi.js"></script>
<script>
(() => {
  "use strict";
  const cfg = window.BANK_CONFIG;
  const $ = (id) => document.getElementById(id);
  const { BrowserProvider, JsonRpcProvider, Contract, Interface, formatEther, parseEther, isAddress, getAddress } = ethers;

  const iface = new Interface(window.BANK_ABI);
  const hasContract = isAddress(cfg.contractAddress);
  const rpc = new JsonRpcProvider(cfg.rpcUrl, Number(cfg.chainId), { staticNetwork: true });

  let wallet = null;        // BrowserProvider
  let signer = null;
  let account = null;
  let chainOk = false;
  let busy = false;
  let bankBalWei = 0n, walBalWei = 0n;

  // ---------- 工具 ----------
  const fmt = (w) => {
    const [i, d = ""] = formatEther(w).split(".");
    const dd = d.slice(0, 6).replace(/0+$/, "");
    if (!dd && w > 0n && i === "0") return "<0.000001";
    return dd ? `${i}.${dd}` : i;
  };
  const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  function setStatus(text, kind, txHash) {
    const s = $("status");
    s.className = kind || "";
    s.textContent = text;
    if (txHash) {
      s.appendChild(document.createTextNode("\n"));
      const a = el("a", null, "在区块浏览器查看");
      a.href = `${cfg.explorer}/tx/${txHash}`;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      s.appendChild(a);
    }
  }
  function showBanner(text, buttonText, onClick) {
    const b = $("banner");
    b.replaceChildren();
    if (!text) { b.hidden = true; return; }
    b.appendChild(el("div", null, text));
    if (buttonText) {
      const btn = el("button", "ghost", buttonText);
      btn.type = "button"; btn.onclick = onClick;
      b.appendChild(btn);
    }
    b.hidden = false;
  }

  function errorData(e) {
    return e?.data || e?.error?.data || e?.info?.error?.data || e?.info?.error?.data?.data || null;
  }
  function friendly(e) {
    if (e?.code === "ACTION_REJECTED" || e?.code === 4001) return "你已在钱包中取消操作";
    if (e?.code === "INSUFFICIENT_FUNDS") return "钱包里的 ETH 不足（需要预留手续费）";
    const data = errorData(e);
    if (typeof data === "string" && data.startsWith("0x")) {
      try {
        const p = iface.parseError(data);
        switch (p.name) {
          case "ZeroAmount": return "金额不能为 0";
          case "InsufficientBalance": return `银行余额不足（可用 ${fmt(p.args[0])} ${cfg.symbol}）`;
          case "InvalidRecipient": return "收款地址无效（不能是自己、零地址或合约本身）";
          case "TransferFailed": return "转出失败，请稍后再试";
          case "Reentrancy": return "操作过于频繁，请稍后再试";
        }
      } catch (_) {}
    }
    return e?.shortMessage || e?.reason || e?.message || "操作失败";
  }

  function parseAmount(str) {
    const v = str.trim().replace(",", ".");
    if (!v) throw new Error("请输入金额");
    let w;
    try { w = parseEther(v); } catch (_) { throw new Error("金额格式不正确（最多 18 位小数）"); }
    if (w <= 0n) throw new Error("金额必须大于 0");
    return w;
  }

  // ---------- 合约 / 读取 ----------
  const readRunner = () => (chainOk && wallet ? wallet : rpc);
  const bankRead = () => new Contract(cfg.contractAddress, window.BANK_ABI, readRunner());
  const bankWrite = () => new Contract(cfg.contractAddress, window.BANK_ABI, signer);

  function render() {
    $("sym1").textContent = cfg.symbol;
    $("acct").textContent = account ? account : "未连接";
    $("bankBal").textContent = account ? fmt(bankBalWei) : "—";
    $("walBal").textContent = account ? `${fmt(walBalWei)} ${cfg.symbol}` : "—";
    const pill = $("netPill");
    if (!account) { pill.textContent = "未连接"; pill.className = "pill"; }
    else if (chainOk) { pill.textContent = cfg.chainName; pill.className = "pill ok"; }
    else { pill.textContent = "网络不对"; pill.className = "pill bad"; }
    const ready = !!(account && chainOk && hasContract);
    document.querySelectorAll("[data-need-wallet]").forEach((b) => (b.disabled = !ready || busy));
    $("connectBtn").textContent = account ? "已连接" : "连接钱包";
    $("connectBtn").disabled = !!account;
  }

  async function refresh() {
    if (!hasContract) return;
    try {
      const bank = bankRead();
      $("totalDep").textContent = `${fmt(await bank.totalDeposits())} ${cfg.symbol}`;
      if (account && chainOk) {
        [walBalWei, bankBalWei] = await Promise.all([wallet.getBalance(account), bank.balanceOf(account)]);
      }
    } catch (e) {
      setStatus("读取链上数据失败：" + friendly(e), "err");
    }
    render();
    loadHistory();
  }

  // ---------- 历史记录 ----------
  async function loadHistory() {
    const list = $("history");
    if (!account || !chainOk || !hasContract) return;
    try {
      const bank = bankRead();
      const latest = await wallet.getBlockNumber();
      const start = Math.max(Number(cfg.deployBlock) || 0, latest - 40000);
      const filters = [
        bank.filters.Deposited(account),
        bank.filters.Withdrawn(account),
        bank.filters.Transferred(account, null),
        bank.filters.Transferred(null, account),
      ];
      let logs = [];
      for (const f of filters) {
        let got = [];
        try { got = await bank.queryFilter(f, start, latest); }
        catch (_) { got = await bank.queryFilter(f, Math.max(start, latest - 5000), latest); }
        logs = logs.concat(got);
      }
      const seen = new Set();
      logs = logs.filter((l) => { const k = l.transactionHash + ":" + l.index; if (seen.has(k)) return false; seen.add(k); return true; });
      logs.sort((a, b) => b.blockNumber - a.blockNumber || b.index - a.index);
      list.replaceChildren();
      if (!logs.length) { list.appendChild(el("li", "empty", "暂无记录")); return; }
      for (const l of logs.slice(0, 20)) {
        const amt = l.args.amount;
        let title, sub, sign;
        if (l.eventName === "Deposited") { title = "存款"; sub = "钱包 → 银行"; sign = "+"; }
        else if (l.eventName === "Withdrawn") { title = "取款"; sub = "银行 → 钱包"; sign = "-"; }
        else if (l.args.from.toLowerCase() === account.toLowerCase()) { title = "转出"; sub = "至 " + short(l.args.to); sign = "-"; }
        else { title = "转入"; sub = "来自 " + short(l.args.from); sign = "+"; }
        const li = el("li");
        const left = el("div");
        const a = el("a", null, title);
        a.href = `${cfg.explorer}/tx/${l.transactionHash}`; a.target = "_blank"; a.rel = "noopener noreferrer";
        left.appendChild(a);
        left.appendChild(el("div", "sub", `${sub} · 区块 ${l.blockNumber}`));
        li.appendChild(left);
        li.appendChild(el("div", sign === "+" ? "pos" : "neg", `${sign}${fmt(amt)}`));
        list.appendChild(li);
      }
    } catch (e) {
      list.replaceChildren(el("li", "empty", "记录加载失败：" + friendly(e)));
    }
  }

  // ---------- 钱包连接 / 网络 ----------
  async function checkChain() {
    const net = await wallet.getNetwork();
    chainOk = net.chainId === BigInt(cfg.chainId);
    if (!chainOk) {
      showBanner(`当前钱包不在 ${cfg.chainName} 网络，请切换后再操作。`, `切换到 ${cfg.chainName}`, switchChain);
    } else {
      showBanner(hasContract ? "" : "还没有配置合约地址：请先部署合约，并把地址填入 web/config.js。");
    }
  }

  async function switchChain() {
    const hex = "0x" + BigInt(cfg.chainId).toString(16);
    try {
      await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
    } catch (e) {
      if (e?.code === 4902 || e?.data?.originalError?.code === 4902) {
        try {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: hex, chainName: cfg.chainName, rpcUrls: [cfg.rpcUrl],
              nativeCurrency: { name: cfg.symbol, symbol: cfg.symbol, decimals: 18 },
              blockExplorerUrls: [cfg.explorer],
            }],
          });
        } catch (e2) { setStatus(friendly(e2), "err"); }
      } else setStatus(friendly(e), "err");
    }
  }

  async function connect(silent) {
    if (!window.ethereum) { setStatus("没有检测到钱包，请在 MetaMask / Trust 等钱包的内置浏览器中打开本页。", "err"); return; }
    try {
      wallet = new BrowserProvider(window.ethereum, "any");
      const accounts = await wallet.send(silent ? "eth_accounts" : "eth_requestAccounts", []);
      if (!accounts.length) { wallet = null; return; }
      signer = await wallet.getSigner();
      account = getAddress(accounts[0]);
      await checkChain();
      render();
      await refresh();
      if (!silent) setStatus("已连接钱包", "ok");
    } catch (e) { setStatus(friendly(e), "err"); }
  }

  // ---------- 交易 ----------
  async function run(label, fn) {
    if (busy) return;
    busy = true; render();
    try {
      setStatus("请在钱包中确认交易…");
      const tx = await fn();
      setStatus("已提交，等待区块确认…", "", tx.hash);
      await tx.wait();
      setStatus(`✅ ${label}成功`, "ok", tx.hash);
      ["depAmt", "wdAmt", "trAmt"].forEach((id) => ($(id).value = ""));
      await refresh();
    } catch (e) {
      setStatus("❌ " + friendly(e), "err");
    } finally { busy = false; render(); }
  }

  $("depBtn").onclick = () => {
    let w; try { w = parseAmount($("depAmt").value); } catch (e) { return setStatus("❌ " + e.message, "err"); }
    if (w > walBalWei) return setStatus("❌ 钱包余额不足", "err");
    run("存款", () => bankWrite().deposit({ value: w }));
  };
  $("wdBtn").onclick = () => {
    let w; try { w = parseAmount($("wdAmt").value); } catch (e) { return setStatus("❌ " + e.message, "err"); }
    if (w > bankBalWei) return setStatus("❌ 银行余额不足", "err");
    run("取款", () => bankWrite().withdraw(w));
  };
  $("wdMax").onclick = () => { $("wdAmt").value = formatEther(bankBalWei); };
  $("trMax").onclick = () => { $("trAmt").value = formatEther(bankBalWei); };
  $("trBtn").onclick = () => {
    const raw = $("toAddr").value.trim();
    if (!isAddress(raw)) return setStatus("❌ 收款地址格式不正确", "err");
    const to = getAddress(raw);
    if (to === account) return setStatus("❌ 不能转给自己", "err");
    let w; try { w = parseAmount($("trAmt").value); } catch (e) { return setStatus("❌ " + e.message, "err"); }
    if (w > bankBalWei) return setStatus("❌ 银行余额不足", "err");
    if (!confirm(`确认转账？\n\n金额：${fmt(w)} ${cfg.symbol}\n收款地址：${to}\n\n链上转账不可撤销。`)) return;
    run("转账", () => bankWrite().transfer(to, w));
  };

  // ---------- 页面交互 ----------
  document.querySelectorAll(".tabs button").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
      ["deposit", "withdraw", "transfer"].forEach((t) => ($("p-" + t).hidden = t !== b.dataset.tab));
      setStatus("");
    };
  });
  $("connectBtn").onclick = () => connect(false);
  $("reloadBtn").onclick = () => refresh();

  if (window.ethereum) {
    window.ethereum.on?.("accountsChanged", () => location.reload());
    window.ethereum.on?.("chainChanged", () => location.reload());
  } else {
    $("mmLink").href = "https://metamask.app.link/dapp/" + location.host + location.pathname;
    $("mmLink").hidden = false;
  }

  if (hasContract) {
    const l = $("contractLink");
    l.href = `${cfg.explorer}/address/${cfg.contractAddress}`;
    l.hidden = false;
  } else {
    showBanner("还没有配置合约地址：请先部署合约，并把地址填入 web/config.js。");
  }

  render();
  refresh();
  if (window.ethereum) connect(true);
})();
</script>
</body>
</html>
